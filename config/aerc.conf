# Only overrides; everything else uses aerc defaults.
# Theme: any file name in /usr/share/aerc/stylesets (nord, dracula, catppuccin, solarized-dark, ...).

[filters]
text/plain=colorize
text/html=w3m -dump -T text/html -I UTF-8 -O UTF-8
image/*=catimg -w$(tput cols) -
.headers=colorize

[openers]
# :open / :open-link hand off to the desktop default handler
x-scheme-handler/http*=xdg-open {}
text/html=xdg-open {}
image/*=xdg-open {}
application/*=xdg-open {}

[ui]
styleset-name=nord
